services:
  mysql:
    image: mysql:8.0
    container_name: pk-mysql-local
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: pk_root_local
      MYSQL_DATABASE: pk
      MYSQL_USER: pk
      MYSQL_PASSWORD: pk
      TZ: Asia/Jakarta
    volumes:
      - pk-mysql-data:/var/lib/mysql
      - ./sql/create_pk_schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-upk", "-ppk"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: pk-redis-local
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pk-mysql-data:
