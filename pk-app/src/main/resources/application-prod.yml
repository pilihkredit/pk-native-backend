# Production (all sensitive values from environment / secret store)
spring:
  datasource:
    url: ${PK_DB_URL}
    username: ${PK_DB_USERNAME}
    password: ${PK_DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

logging:
  level:
    root: WARN
    com.pk: INFO

management:
  endpoints:
    web:
      exposure:
        include: health

pk:
  auth:
    jwt-secret: ${PK_AUTH_JWT_SECRET}
    otp-fixed-code: ${PK_AUTH_OTP_FIXED_CODE:}
