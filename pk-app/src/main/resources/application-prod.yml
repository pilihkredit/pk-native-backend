# Production (all sensitive values from environment / secret store)
spring:
  datasource:
    url: ${PK_DB_URL}
    username: ${PK_DB_USERNAME}
    password: ${PK_DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

logging:
  level:
    root: WARN
    com.pk: INFO

management:
  endpoints:
    web:
      exposure:
        include: health

pk:
  lender:
    config:
      source: db
      provider-code: pendanaan
  ocr:
    enabled: true
    access-key: ${PK_OCR_ACCESS_KEY:de40a837df9c2f66}
    secret-key: ${PK_OCR_SECRET_KEY:2f4250cb52fe879c}
    access-token-url: https://api.advance.ai/openapi/auth/ticket/v1/generate-token
    database-id-validation-url: https://api.advance.ai/openapi/face-identity/v6/database-id-validation
    base-url: https://api.advance.ai/openapi
    ocr-check-url: /face-recognition/v3/ocr-ktp-check
    liveness-detection-url: /liveness/v3/detection-result
    face-recognition-url: /face-recognition/v4/check
