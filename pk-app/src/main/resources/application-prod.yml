# Production (all sensitive values from environment / secret store)
spring:
  datasource:
    url: ${PK_DB_URL}
    username: ${PK_DB_USERNAME}
    password: ${PK_DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

logging:
  level:
    root: WARN
    com.pk: INFO

management:
  endpoints:
    web:
      exposure:
        include: health

pk:
  lender:
    pendanaan:
      mode: http
      base-url: ${PK_PENDANAAN_BASE_URL:}
      client-id: ${PK_PENDANAAN_CLIENT_ID:}
      client-secret: ${PK_PENDANAAN_CLIENT_SECRET:}
