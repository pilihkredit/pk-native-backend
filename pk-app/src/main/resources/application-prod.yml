# Production configuration. All environment variables are required.
spring:
  datasource:
    url: ${PK_BACKEND_MYSQL_HOST}
    username: ${PK_BACKEND_MYSQL_USER}
    password: ${PK_BACKEND_MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: ${PK_DB_MAXIMUM_POOL_SIZE}
  data:
    redis:
      host: ${PK_REDIS_HOST}
      port: ${PK_REDIS_PORT}

pk:
  debug:
    user-progress:
      enabled: ${PK_DEBUG_USER_PROGRESS_ENABLED}
      token: ${PK_DEBUG_USER_PROGRESS_TOKEN}
  fcm:
    enabled: ${PK_FCM_ENABLED:false}
    project-id: ${PK_FCM_PROJECT_ID:}
    credentials-path: "${PK_FCM_CREDENTIALS_PATH:}"
    credentials-json: "${PK_FCM_CREDENTIALS_JSON:}"
    credentials-json-base64: "${PK_FCM_CREDENTIALS_JSON_BASE64:}"
  lender:
    config:
      source: db
      provider-code: apipartner
    apipartner:
      read-timeout-ms: ${PK_LENDER_APIPARTNER_READ_TIMEOUT_MS}
  callback:
    oauth:
      client-id: ${PK_CALLBACK_CLIENT_ID}
      client-secret: ${PK_CALLBACK_CLIENT_SECRET}
  profile:
    sync:
      mode: inline
  credit:
    apply:
      mode: inline
  loan:
    apply:
      mode: inline
  biometric-storage:
    oss:
      enabled: ${PK_BIOMETRIC_OSS_ENABLED}
      endpoint: ${PK_BIOMETRIC_OSS_ENDPOINT}
      bucket: ${PK_BIOMETRIC_OSS_BUCKET}
      access-key-id: ${PK_BIOMETRIC_OSS_ACCESS_KEY_ID}
      access-key-secret: ${PK_BIOMETRIC_OSS_ACCESS_KEY_SECRET}
  ocr:
    dev-lender-sync-enabled: ${PK_OCR_DEV_LENDER_SYNC_ENABLED}
  logging:
    sls:
      enabled: ${PK_SLS_ENABLED}
      endpoint: ${PK_SLS_ENDPOINT}
      project: ${PK_SLS_PROJECT}
      access-key-id: ${PK_SLS_ACCESS_KEY_ID}
      access-key-secret: ${PK_SLS_ACCESS_KEY_SECRET}

logging:
  level:
    root: INFO
    com.pk: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
