spring:
  application:
    name: pk-app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${PK_APP_PORT:8831}

pk:
  environment: ${SPRING_PROFILES_ACTIVE:local}
  api:
    v1-prefix: ${PK_API_V1_PREFIX:/api/v1}
    logging:
      enabled: ${PK_API_LOGGING_ENABLED:true}
      max-body-bytes: ${PK_API_LOGGING_MAX_BODY_BYTES:65536}
  auth:
    access-token-ttl: ${PK_AUTH_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${PK_AUTH_REFRESH_TOKEN_TTL:30d}
    otp-ttl: ${PK_AUTH_OTP_TTL:5m}
    otp-resend-interval: ${PK_AUTH_OTP_RESEND_INTERVAL:60s}
    otp-daily-limit: ${PK_AUTH_OTP_DAILY_LIMIT:10}
    otp-daily-limit-zone: ${PK_AUTH_OTP_DAILY_LIMIT_ZONE:Asia/Jakarta}
    jwt-secret: ${PK_AUTH_JWT_SECRET:local-dev-secret-change-in-prod-min-32-chars}
    password-max-failed-attempts: ${PK_AUTH_PASSWORD_MAX_FAILED_ATTEMPTS:5}
    password-lock-duration: ${PK_AUTH_PASSWORD_LOCK_DURATION:15m}
  security:
    field-encryption-key: ${PK_FIELD_ENCRYPTION_KEY:local-dev-field-encryption-key-32b}
  reference:
    bank-cache-ttl: ${PK_REFERENCE_BANK_CACHE_TTL:24h}
    area-cache-ttl: ${PK_REFERENCE_AREA_CACHE_TTL:24h}
  lender:
    config:
      source: ${PK_LENDER_CONFIG_SOURCE:db}
      provider-code: ${PK_LENDER_CONFIG_PROVIDER_CODE:pendanaan}
    pendanaan:
      connect-timeout-ms: ${PK_LENDER_PENDANAAN_CONNECT_TIMEOUT_MS:10000}
      read-timeout-ms: ${PK_LENDER_PENDANAAN_READ_TIMEOUT_MS:30000}
      logging:
        enabled: ${PK_LENDER_PENDANAAN_LOGGING_ENABLED:true}
        max-body-bytes: ${PK_LENDER_PENDANAAN_LOGGING_MAX_BODY_BYTES:65536}
  profile:
    sync:
      mode: ${PK_PROFILE_SYNC_MODE:inline}
      max-retries: ${PK_PROFILE_SYNC_MAX_RETRIES:5}
      retry-backoff-seconds: ${PK_PROFILE_SYNC_RETRY_BACKOFF_SECONDS:60}
  ocr:
    enabled: ${PK_OCR_ENABLED:false}
    access-key: ${PK_OCR_ACCESS_KEY:}
    secret-key: ${PK_OCR_SECRET_KEY:}
    access-token-url: ${PK_OCR_ACCESS_TOKEN_URL:https://api.advance.ai/openapi/auth/ticket/v1/generate-token}
    database-id-validation-url: ${PK_OCR_DATABASE_ID_VALIDATION_URL:https://api.advance.ai/openapi/face-identity/v6/database-id-validation}
    base-url: ${PK_OCR_BASE_URL:https://api.advance.ai/openapi}
    ocr-check-url: ${PK_OCR_CHECK_URL:/face-recognition/v3/ocr-ktp-check}
    liveness-detection-url: ${PK_OCR_LIVENESS_DETECTION_URL:/liveness/v3/detection-result}
    face-recognition-url: ${PK_OCR_FACE_RECOGNITION_URL:/face-recognition/v4/check}
    dev-lender-sync-enabled: ${PK_OCR_DEV_LENDER_SYNC_ENABLED:false}
    session-ttl: ${PK_OCR_SESSION_TTL:30m}
    liveness-threshold: ${PK_OCR_LIVENESS_THRESHOLD:60}
    face-threshold: ${PK_OCR_FACE_THRESHOLD:60}
    license-effective-seconds: ${PK_OCR_LICENSE_EFFECTIVE_SECONDS:86400}
  credit:
    apply:
      mode: ${PK_CREDIT_APPLY_MODE:inline}
      max-retries: ${PK_CREDIT_APPLY_MAX_RETRIES:5}
      retry-backoff-seconds: ${PK_CREDIT_APPLY_RETRY_BACKOFF_SECONDS:60}
      poll-interval-seconds: ${PK_CREDIT_POLL_INTERVAL_SECONDS:30}
  loan:
    product:
      cache-ttl: ${PK_LOAN_PRODUCT_CACHE_TTL:30s}
    quote:
      ttl: ${PK_LOAN_QUOTE_TTL:15m}
    apply:
      max-retries: ${PK_LOAN_APPLY_MAX_RETRIES:5}
      retry-backoff-seconds: ${PK_LOAN_APPLY_RETRY_BACKOFF_SECONDS:60}
      poll-interval-seconds: ${PK_LOAN_POLL_INTERVAL_SECONDS:30}
  callback:
    enabled: ${PK_CALLBACK_ENABLED:true}
    oauth:
      client-id: ${PK_CALLBACK_CLIENT_ID:local-callback-client}
      client-secret: ${PK_CALLBACK_CLIENT_SECRET:local-callback-secret}
      access-token-ttl: ${PK_CALLBACK_ACCESS_TOKEN_TTL:2h}
