spring:
  datasource:
    url: ${PK_DB_URL}
    username: ${PK_DB_USERNAME}
    password: ${PK_DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

logging:
  level:
    root: WARN
    com.pk: INFO

management:
  endpoints:
    web:
      exposure:
        include: health

pk:
  lender:
    config:
      source: db
      provider-code: pendanaan
  worker:
    reference:
      enabled: true
