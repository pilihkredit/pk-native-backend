spring:
  application:
    name: pk-worker
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${PK_WORKER_PORT:8081}

pk:
  environment: ${SPRING_PROFILES_ACTIVE:local}
  worker:
    outbox:
      poll-interval-ms: 5000
