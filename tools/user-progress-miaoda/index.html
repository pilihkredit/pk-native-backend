<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KTA 用户进度诊断台</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070a12;
      --panel: rgba(15, 23, 42, .78);
      --panel-strong: rgba(15, 23, 42, .94);
      --line: rgba(148, 163, 184, .22);
      --text: #e5edf8;
      --muted: #8da0b8;
      --cyan: #22d3ee;
      --green: #34d399;
      --red: #fb7185;
      --amber: #fbbf24;
      --blue: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 10%, rgba(34, 211, 238, .18), transparent 34rem),
        radial-gradient(circle at 88% 4%, rgba(96, 165, 250, .16), transparent 34rem),
        linear-gradient(135deg, #050712, #0d1324 52%, #07111c);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    .shell { width: min(1320px, calc(100vw - 32px)); margin: 0 auto; padding: 28px 0 44px; }
    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-end;
      padding: 18px 0 28px;
    }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 46px); line-height: 1.05; }
    .subtitle { margin-top: 10px; color: var(--muted); font-size: 14px; }
    .badge {
      border: 1px solid rgba(34, 211, 238, .36);
      background: rgba(34, 211, 238, .09);
      color: #b7f4ff;
      padding: 9px 12px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
      box-shadow: 0 0 28px rgba(34, 211, 238, .11);
    }
    .panel {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(18px);
      border-radius: 8px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .36);
    }
    .search {
      display: grid;
      grid-template-columns: 1.2fr .9fr .8fr auto;
      gap: 12px;
      padding: 16px;
      align-items: end;
    }
    .card-toolbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .card-toolbar h2 { margin: 0; }
    .api-filter { min-width: min(100%, 420px); flex: 1; }
    .api-summary {
      margin-bottom: 14px;
      padding: 12px 14px;
      border: 1px solid rgba(34, 211, 238, .18);
      background: rgba(34, 211, 238, .06);
      border-radius: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    .api-summary strong { color: #dbeafe; }
    label { display: grid; gap: 8px; color: var(--muted); font-size: 12px; }
    input, select {
      width: 100%;
      border: 1px solid rgba(148, 163, 184, .24);
      background: rgba(2, 6, 23, .72);
      color: var(--text);
      border-radius: 8px;
      padding: 12px 13px;
      outline: none;
      font-size: 14px;
    }
    input:focus, select:focus { border-color: rgba(34, 211, 238, .72); box-shadow: 0 0 0 3px rgba(34, 211, 238, .12); }
    button {
      border: 0;
      border-radius: 8px;
      padding: 13px 18px;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #031018;
      font-weight: 800;
      cursor: pointer;
      min-width: 112px;
      box-shadow: 0 16px 36px rgba(34, 211, 238, .2);
    }
    button:disabled { opacity: .58; cursor: wait; }
    .status { margin: 14px 2px 0; color: var(--muted); min-height: 22px; }
    .grid { display: grid; grid-template-columns: 360px 1fr; gap: 16px; margin-top: 16px; }
    .card { padding: 16px; }
    .card h2 { margin: 0 0 14px; font-size: 15px; color: #dbeafe; }
    .kv { display: grid; gap: 10px; }
    .kv div { display: flex; justify-content: space-between; gap: 14px; color: var(--muted); font-size: 13px; }
    .kv strong { color: var(--text); overflow-wrap: anywhere; text-align: right; }
    .modules { display: grid; gap: 10px; }
    .module {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--line);
      background: rgba(2, 6, 23, .46);
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
    }
    .ok { color: var(--green); }
    .miss { color: var(--red); }
    .timeline { display: grid; gap: 16px; }
    .endpoint-group {
      border: 1px solid var(--line);
      background: rgba(2, 6, 23, .42);
      border-radius: 8px;
      padding: 14px;
      display: grid;
      gap: 12px;
    }
    .endpoint-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(148, 163, 184, .16);
    }
    .endpoint-title {
      font-size: 14px;
      font-weight: 800;
      color: #dbeafe;
      overflow-wrap: anywhere;
    }
    .endpoint-count {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .event {
      border: 1px solid var(--line);
      background: var(--panel-strong);
      border-radius: 8px;
      padding: 14px;
    }
    .event-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .type { font-size: 15px; font-weight: 800; color: #eff6ff; }
    .endpoint { color: var(--muted); font-size: 12px; margin-top: 4px; overflow-wrap: anywhere; }
    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      white-space: nowrap;
    }
    .pill.success { color: var(--green); border-color: rgba(52, 211, 153, .38); background: rgba(52, 211, 153, .08); }
    .pill.fail { color: var(--red); border-color: rgba(251, 113, 133, .38); background: rgba(251, 113, 133, .08); }
    .event-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; color: var(--muted); font-size: 12px; }
    .jsons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .json-panel { display: grid; gap: 8px; }
    .json-panel h3 {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      color: #93c5fd;
      letter-spacing: .02em;
    }
    pre, .annotated-json {
      margin: 0;
      max-height: 260px;
      overflow: auto;
      border: 1px solid rgba(148, 163, 184, .18);
      background: rgba(2, 6, 23, .72);
      border-radius: 8px;
      padding: 10px;
      color: #c7d2fe;
      font-size: 12px;
      line-height: 1.45;
    }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    .annotated-json { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .json-line { min-height: 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .json-key { color: #67e8f9; }
    .json-string { color: #bbf7d0; }
    .json-number { color: #fde68a; }
    .json-bool { color: #fca5a5; }
    .json-null { color: #94a3b8; }
    .json-comment { color: #93c5fd; opacity: .92; margin-left: 8px; }
    .empty {
      padding: 28px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed rgba(148, 163, 184, .28);
      border-radius: 8px;
    }
    @media (max-width: 980px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .search { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
      .jsons { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="topbar">
      <div>
        <h1>KTA 用户进度诊断台</h1>
        <div class="subtitle">按手机号查询用户进度，并从开放平台 Lender 接口下拉选择，查看该接口全部请求参数与返回参数。</div>
      </div>
      <div class="badge">Feishu App Console</div>
    </section>

    <section class="panel search">
      <label>Environment
        <select id="baseUrl">
          <option value="https://api-test.pilihkredit.id/api/v1">测试环境 - https://api-test.pilihkredit.id/api/v1</option>
          <option value="https://api.pilihkredit.id/api/v1">生产环境 - https://api.pilihkredit.id/api/v1</option>
        </select>
      </label>
      <label>Debug Token
        <input id="debugToken" placeholder="X-Debug-Token" type="password" autocomplete="off">
      </label>
      <label>Mobile No
        <input id="mobileNo" placeholder="801234567" autocomplete="off">
      </label>
      <button id="queryBtn">查询</button>
    </section>
    <div id="status" class="status"></div>

    <section class="grid">
      <aside class="panel card">
        <h2>用户与进度</h2>
        <div id="profile" class="kv">
          <div><span>状态</span><strong>等待查询</strong></div>
        </div>
        <h2 style="margin-top:22px;">模块完成度</h2>
        <div id="modules" class="modules"></div>
      </aside>
      <section class="panel card">
        <div class="card-toolbar">
          <h2>Lender 接口排查</h2>
          <label class="api-filter">Lender 接口
            <select id="lenderApi" disabled>
              <option value="">请先查询手机号</option>
            </select>
          </label>
        </div>
        <div id="apiSummary" class="api-summary">选择手机号并查询后，可按开放平台接口文档筛选 Lender 路径。</div>
        <div id="timeline" class="timeline">
          <div class="empty">输入手机号后，选择 Lender 接口查看请求与返回参数。</div>
        </div>
      </section>
    </section>
  </main>

    els.baseUrl.value = localStorage.getItem('ktaDebugBaseUrl') || 'https://api-test.pilihkredit.id/api/v1';
    els.debugToken.value = localStorage.getItem('ktaDebugToken') || '';

    function setStatus(text, tone) {
      els.status.textContent = text || '';
      els.status.style.color = tone === 'error' ? 'var(--red)' : tone === 'ok' ? 'var(--green)' : 'var(--muted)';
    }

    function safeJson(text) {
      if (!text) return '';
      try { return JSON.stringify(JSON.parse(text), null, 2); } catch (_) { return text; }
    }

    function annotatedJson(text) {
      if (!text) return '';
      try {
        return renderJsonValue(JSON.parse(text), 0);
      } catch (_) {
        return `<pre>${esc(text)}</pre>`;
      }
    }

    function renderJsonValue(value, depth, keyName) {
      const pad = '  '.repeat(depth);
      if (Array.isArray(value)) {
        if (value.length === 0) return line(`${pad}[]`, keyName);
        const rows = [line(`${pad}[`, keyName)];
        value.forEach((item, index) => {
          rows.push(renderJsonValue(item, depth + 1));
          if (index < value.length - 1) rows[rows.length - 1] = rows[rows.length - 1].replace('</div>', ',</div>');
        });
        rows.push(line(`${pad}]`));
        return rows.join('');
      }
      if (value && typeof value === 'object') {
        const entries = Object.entries(value);
        if (entries.length === 0) return line(`${pad}{}`, keyName);
        const rows = [line(`${pad}{`, keyName)];
        entries.forEach(([key, child], index) => {
          const comma = index < entries.length - 1 ? ',' : '';
          if (child && typeof child === 'object') {
            rows.push(line(`${'  '.repeat(depth + 1)}<span class="json-key">"${esc(key)}"</span>:`, key));
            rows.push(renderJsonValue(child, depth + 1).replace(/<\/div>$/, `${comma}</div>`));
          } else {
            rows.push(line(`${'  '.repeat(depth + 1)}<span class="json-key">"${esc(key)}"</span>: ${formatPrimitive(child)}${comma}`, key));
          }
        });
        rows.push(line(`${pad}}`));
        return rows.join('');
      }
      return line(`${pad}${formatPrimitive(value)}`, keyName);
    }

    function line(content, keyName) {
      const comment = keyName && FIELD_COMMENTS[keyName]
        ? ` <span class="json-comment">// ${esc(FIELD_COMMENTS[keyName])}</span>`
        : '';
      return `<div class="json-line">${content}${comment}</div>`;
    }

    function formatPrimitive(value) {
      if (typeof value === 'string') return `<span class="json-string">"${esc(value)}"</span>`;
      if (typeof value === 'number') return `<span class="json-number">${String(value)}</span>`;
      if (typeof value === 'boolean') return `<span class="json-bool">${String(value)}</span>`;
      if (value === null) return '<span class="json-null">null</span>';
      return esc(String(value));
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function renderEmpty(message) {
      els.profile.innerHTML = `<div><span>状态</span><strong>${esc(message)}</strong></div>`;
      els.modules.innerHTML = '';
      els.apiSummary.textContent = '选择手机号并查询后，可按开放平台接口文档筛选 Lender 路径。';
      els.lenderApi.innerHTML = '<option value="">请先查询手机号</option>';
      els.lenderApi.disabled = true;
      els.timeline.innerHTML = `<div class="empty">${esc(message)}</div>`;
      lastQueryData = null;
    }

    function normalizeOpenApiPath(endpoint) {
      if (!endpoint) return '';
      let value = endpoint.trim();
      try {
        value = new URL(value).pathname;
      } catch (_) {}
      const idx = value.indexOf('/api/open/v1');
      return idx >= 0 ? value.slice(idx) : value;
    }

    function apiKey(api) {
      return `${api.method} ${api.path}`;
    }

    function findApiDefinition(item) {
      const path = normalizeOpenApiPath(item.endpoint);
      return LENDER_APIS.find(api => api.path === path && api.method === (item.httpMethod || '').toUpperCase())
        || LENDER_APIS.find(api => api.path === path);
    }

    function countByApi(interactions) {
      const counts = new Map(LENDER_APIS.map(api => [apiKey(api), 0]));
      const extras = new Map();
      for (const item of interactions) {
        const api = findApiDefinition(item);
        if (api) {
          counts.set(apiKey(api), (counts.get(apiKey(api)) || 0) + 1);
          continue;
        }
        const key = endpointKey(item);
        extras.set(key, (extras.get(key) || 0) + 1);
      }
      return { counts, extras };
    }

    function populateLenderApiSelect(interactions) {
      const { counts, extras } = countByApi(interactions);
      const total = interactions.length;
      const options = [`<option value="__all__">全部接口（${total} 条）</option>`];
      for (const api of LENDER_APIS) {
        const count = counts.get(apiKey(api)) || 0;
        const label = `${api.no}. ${api.name} — ${api.method} ${api.path}（${count} 条）`;
        options.push(`<option value="${esc(apiKey(api))}">${esc(label)}</option>`);
      }
      for (const [key, count] of extras.entries()) {
        options.push(`<option value="${esc('__extra__:' + key)}">其他 — ${esc(key)}（${count} 条）</option>`);
      }
      els.lenderApi.innerHTML = options.join('');
      els.lenderApi.disabled = false;
      const firstWithRecords = LENDER_APIS.find(api => (counts.get(apiKey(api)) || 0) > 0);
      els.lenderApi.value = firstWithRecords ? apiKey(firstWithRecords) : '__all__';
    }

    function filterInteractions(interactions, selected) {
      if (!selected || selected === '__all__') return interactions;
      if (selected.startsWith('__extra__:')) {
        const key = selected.slice('__extra__:'.length);
        return interactions.filter(item => endpointKey(item) === key);
      }
      const api = LENDER_APIS.find(item => apiKey(item) === selected);
      if (!api) return interactions;
      return interactions.filter(item => {
        const path = normalizeOpenApiPath(item.endpoint);
        const method = (item.httpMethod || '').toUpperCase();
        return path === api.path && (!api.method || method === api.method);
      });
    }

    function selectedApiMeta(selected) {
      if (!selected || selected === '__all__') {
        return { title: '全部 Lender 接口', method: '-', path: '按路径分组展示' };
      }
      if (selected.startsWith('__extra__:')) {
        return { title: '其他接口', method: '', path: selected.slice('__extra__:'.length) };
      }
      const api = LENDER_APIS.find(item => apiKey(item) === selected);
      if (!api) return { title: '未知接口', method: '', path: selected };
      return { title: `${api.no}. ${api.name}`, method: api.method, path: api.path };
    }

    function renderApiSummary(selected, items) {
      const meta = selectedApiMeta(selected);
      els.apiSummary.innerHTML = `
        <div><strong>${esc(meta.title)}</strong></div>
        <div>方法：<strong>${esc(meta.method || '-')}</strong>　路径：<strong>${esc(meta.path)}</strong></div>
        <div>当前筛选共 <strong>${items.length}</strong> 条调用记录（按时间倒序展示请求参数与返回参数）。</div>
      `;
    }

    function endpointKey(item) {
      return `${item.httpMethod || ''} ${item.endpoint || ''}`.trim();
    }

    function groupByEndpoint(interactions) {
      const groups = new Map();
      for (const item of interactions) {
        const key = endpointKey(item);
        if (!groups.has(key)) {
          groups.set(key, []);
        }
        groups.get(key).push(item);
      }
      return groups;
    }

    function renderInteraction(item, index) {
      return `
        <article class="event">
          <div class="event-head">
            <div>
              <div class="type">#${index + 1} ${esc(item.businessType)}</div>
              <div class="endpoint">${esc(item.httpMethod)} ${esc(item.endpoint)}</div>
            </div>
            <div class="pill ${item.success ? 'success' : 'fail'}">${item.success ? 'SUCCESS' : 'FAILED'}</div>
          </div>
          <div class="event-meta">
            <span>${esc(item.createdAt || '')}</span>
            <span>interactionNo=${esc(item.interactionNo || '')}</span>
            <span>businessId=${esc(item.businessId || '')}</span>
            <span>code=${esc(item.responseCode || '')}</span>
            <span>${esc(item.durationMs ?? '')}ms</span>
          </div>
          <div class="jsons">
            <div class="json-panel">
              <h3>请求参数</h3>
              <div class="annotated-json">${annotatedJson(item.requestRef)}</div>
            </div>
            <div class="json-panel">
              <h3>返回参数</h3>
              <div class="annotated-json">${annotatedJson(item.responseRef || item.responseMsg)}</div>
            </div>
          </div>
        </article>
      `;
    }

    function renderTimeline(interactions, selected) {
      const items = filterInteractions(interactions, selected);
      renderApiSummary(selected, items);
      if (items.length === 0) {
        els.timeline.innerHTML = '<div class="empty">该接口暂无调用记录</div>';
        return;
      }
      if (selected === '__all__') {
        const groups = groupByEndpoint(items);
        els.timeline.innerHTML = [...groups.entries()].map(([path, groupItems]) => `
          <section class="endpoint-group">
            <div class="endpoint-head">
              <div class="endpoint-title">${esc(path)}</div>
              <div class="endpoint-count">${groupItems.length} 条记录</div>
            </div>
            ${groupItems.map((item, index) => renderInteraction(item, index)).join('')}
          </section>
        `).join('');
        return;
      }
      els.timeline.innerHTML = items.map((item, index) => renderInteraction(item, index)).join('');
    }

    function render(data) {
      if (!data || !data.found) {
        renderEmpty('未找到用户');
        return;
      }
      const user = data.user;
      const progress = data.progress;
      els.profile.innerHTML = `
        <div><span>Profile ID</span><strong>${esc(user.profileId)}</strong></div>
        <div><span>Partner User ID</span><strong>${esc(user.partnerUserId)}</strong></div>
        <div><span>Mobile No</span><strong>${esc(user.mobileNo)}</strong></div>
        <div><span>KYC Status</span><strong>${esc(progress.kycStatus)}</strong></div>
      `;
      const completed = new Set(progress.completedModules || []);
      const all = [...new Set([...(progress.completedModules || []), ...(progress.missingModules || [])])];
      els.modules.innerHTML = all.map(name => {
        const done = completed.has(name);
        return `<div class="module"><span>${esc(name)}</span><strong class="${done ? 'ok' : 'miss'}">${done ? 'COMPLETED' : 'MISSING'}</strong></div>`;
      }).join('') || '<div class="empty">没有模块数据</div>';

      const interactions = data.interactions || [];
      lastQueryData = data;
      populateLenderApiSelect(interactions);
      if (interactions.length === 0) {
        els.apiSummary.innerHTML = '<div>该用户暂无 Lender 外呼记录。可先完成进件/授信/借款等流程后再查询。</div>';
        els.timeline.innerHTML = '<div class="empty">没有找到接口交互记录</div>';
        return;
      }
      renderTimeline(interactions, els.lenderApi.value);
    }

    async function query() {
      const baseUrl = els.baseUrl.value.trim().replace(/\/+$/, '');
      const token = els.debugToken.value.trim();
      const mobileNo = els.mobileNo.value.trim();
      if (!baseUrl || !token || !mobileNo) {
        setStatus('请选择环境，并填写 Debug Token 和手机号。', 'error');
        return;
      }
      localStorage.setItem('ktaDebugBaseUrl', baseUrl);
      localStorage.setItem('ktaDebugToken', token);
      els.queryBtn.disabled = true;
      setStatus('查询中...');
      try {
        const url = `${baseUrl}/debug/user-progress?mobileNo=${encodeURIComponent(mobileNo)}`;
        const res = await fetch(url, { headers: { 'X-Debug-Token': token } });
        const body = await res.json();
        if (!res.ok || body.code !== '000000') {
          throw new Error(body.msg || `HTTP ${res.status}`);
        }
        render(body.data);
        setStatus(`查询完成，traceId=${body.traceId || ''}`, 'ok');
      } catch (error) {
        renderEmpty('查询失败');
        setStatus(error.message || String(error), 'error');
      } finally {
        els.queryBtn.disabled = false;
      }
    }

    els.queryBtn.addEventListener('click', query);
    els.lenderApi.addEventListener('change', () => {
      if (!lastQueryData) return;
      renderTimeline(lastQueryData.interactions || [], els.lenderApi.value);
    });
    els.mobileNo.addEventListener('keydown', event => {
      if (event.key === 'Enter') query();
    });
  </script>
